<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>互動式飛行足跡地圖與紀錄器</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #0b0e14; color: #fff; overflow: hidden; }
    #sidebar { width: 380px; min-width: 380px; background: #1e293b; padding: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 1000; box-shadow: 4px 0 15px rgba(0,0,0,0.5); overflow-y: auto; }
    #mapContainer { flex: 1; min-width: 0; position: relative; }
    #map { width: 100%; height: 100%; }
    
    #map .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }
    
    h2 { margin: 0 0 5px 0; font-size: 18px; color: #38bdf8; }
    .form-group { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    label { font-size: 12px; color: #94a3b8; }
    
    /* 讓深色底底下的 date/time 原生圖示轉為淺色 */
    input, select, button { 
      width: 100%; 
      padding: 8px 10px; 
      border-radius: 6px; 
      border: 1px solid #334155; 
      background: #0f172a; 
      color: #fff; 
      font-size: 13px; 
      color-scheme: dark; 
    }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    .row { display: flex; gap: 8px; width: 100%; }
    .row .form-group { flex: 1; }
    
    button.btn-primary { background: #0284c7; border: none; cursor: pointer; font-weight: bold; margin-top: 5px; }
    button.btn-primary:hover { background: #0369a1; }
    
    button.btn-success { background: #10b981; border: none; cursor: pointer; font-weight: bold; }
    button.btn-success:hover { background: #059669; }
    
    button.btn-danger { background: #ef4444; border: none; cursor: pointer; font-weight: bold; }
    button.btn-danger:hover { background: #dc2626; }
    button.btn-danger:disabled { background: #334155; cursor: not-allowed; }

    button.btn-warning { background: #f59e0b; border: none; cursor: pointer; font-weight: bold; }
    button.btn-warning:hover { background: #d97706; }

    .file-actions { display: flex; gap: 8px; margin-top: 5px; border-top: 1px solid #334155; padding-top: 12px; }
    .file-actions input[type="file"] { display: none; }
    .file-btn { flex: 1; text-align: center; padding: 8px; border-radius: 6px; background: #334155; cursor: pointer; font-size: 12px; }
    .file-btn:hover { background: #475569; }

    .control-panel { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
    
    .flight-list-section { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 200px; }
    .list-header { display: flex; justify-content: space-between; align-items: center; }
    .list-actions { display: flex; gap: 6px; }
    .btn-sm { width: auto; padding: 2px 8px; font-size: 11px; }

    .flight-list { flex: 1; max-height: 260px; overflow-y: auto; background: #0f172a; border-radius: 6px; border: 1px solid #334155; padding: 8px; }
    .flight-item { 
      padding: 8px; 
      border-bottom: 1px solid #1e293b; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      background: #131c2e; 
      margin-bottom: 6px; 
      border-radius: 4px; 
      cursor: grab; 
      user-select: none;
      transition: background 0.2s, opacity 0.2s;
    }
    .flight-item:active { cursor: grabbing; }
    .flight-item.dragging { opacity: 0.4; background: #334155; }
    .flight-item:last-child { margin-bottom: 0; }
    .drag-handle { color: #64748b; font-size: 14px; cursor: grab; }
    .flight-item input[type="checkbox"] { width: auto; cursor: pointer; }
    .flight-content { flex: 1; }
    .flight-main { font-weight: bold; font-size: 13px; color: #38bdf8; }
    .flight-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .btn-delete { width: auto; padding: 2px 6px; background: #ef4444; border: none; border-radius: 4px; color: #fff; font-size: 11px; cursor: pointer; }
    .btn-delete:hover { background: #dc2626; }
    
    .flight-info-overlay {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: rgba(15, 23, 42, 0.9); color: #fff;
      padding: 12px 18px; border-radius: 12px; backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      min-width: 220px;
    }


    .row, .form-group, .row .form-group {
      min-width: 0;
    }

    /* --- 手機：直式 --- */
    @media (max-width: 768px) and (orientation: portrait) {
      body { flex-direction: column; }
      #sidebar {
        width: 100%;
        min-width: 0;
        max-height: 52vh;
        padding: 14px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }
      .row {
        flex-direction: column;
      }
      #mapContainer {
        flex: 1;
        min-height: 220px;
      }
      .flight-info-overlay {
        top: 10px;
        right: 10px;
        padding: 8px 12px;
        min-width: 160px;
      }
    }

    /* --- 手機：橫式 --- */
    @media (max-width: 900px) and (orientation: landscape) {
      #sidebar {
        width: 300px;
        min-width: 260px;
        padding: 12px;
        gap: 8px;
      }
      .row { gap: 6px; }
      input, select, button { font-size: 12px; padding: 6px 8px; }
      h2 { font-size: 15px; }
      .flight-info-overlay { padding: 8px 12px; min-width: 160px; }
    }
  </style>
</head>
<body>

<div id="sidebar">
  <h2>✈️ 飛行紀錄管理</h2>

  <div class="form-group">
    <label>出發地 (起點)</label>
    <input list="airports" id="fromAirport" placeholder="輸入或選擇機場 (例: TPE)">
  </div>
  
  <div class="form-group">
    <label>目的地 (終點)</label>
    <input list="airports" id="toAirport" placeholder="輸入或選擇機場 (例: PHX)">
  </div>

  <datalist id="airports"></datalist>

  <div class="row">
    <div class="form-group">
      <label>開始日期 *</label>
      <input type="date" id="startDate">
    </div>
    <div class="form-group">
      <label>開始時間 (可選)</label>
      <input type="time" id="startTime">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>結束日期</label>
      <input type="date" id="endDate">
    </div>
    <div class="form-group">
      <label>結束時間 (可選)</label>
      <input type="time" id="endTime">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>航班號碼 (可選)</label>
      <input type="text" id="flightNo" placeholder="如 JX026">
    </div>
    <div class="form-group">
      <label>航空公司 (可選)</label>
      <input type="text" id="airline" placeholder="如 星宇航空">
    </div>
  </div>

  <button class="btn-primary" onclick="addFlight()">＋ 新增至清單</button>

  <div class="control-panel">
    <div class="row">
      <div class="form-group">
        <label>全部航班總播放秒數</label>
        <select id="totalDurationSec">
          <option value="5">5 秒</option>
          <option value="10" selected>10 秒</option>
          <option value="15">15 秒</option>
          <option value="20">20 秒</option>
          <option value="25">25 秒</option>
          <option value="30">30 秒</option>
        </select>
      </div>
      <div class="form-group">
        <label>航段之間停頓秒數</label>
        <input type="number" id="intervalSec" value="0.5" step="0.5" min="0">
      </div>
    </div>
    <div class="row" style="margin-top: 8px;">
      <button class="btn-success" id="playBtn" onclick="startAnimation()">▶ 播放動畫</button>
      <button class="btn-danger" id="stopBtn" onclick="stopAnimation()" disabled>⏹ 停止播放</button>
    </div>
  </div>

  <div class="file-actions">
    <label class="file-btn" for="jsonFileInput">📂 上傳 JSON</label>
    <input type="file" id="jsonFileInput" accept=".json" onchange="importJSON(event)">
    <button class="file-btn" onclick="exportJSON()">💾 匯出 JSON</button>
  </div>

  <div class="flight-list-section">
    <div class="list-header">
      <label>已登錄航班 (<span id="flightCount">0</span>) <span style="font-size: 10px; color: #64748b;">(可拖拉排序)</span></label>
      <div class="list-actions">
        <button class="btn-warning btn-sm" onclick="deleteSelectedFlights()">刪除選取</button>
        <button class="btn-danger btn-sm" onclick="clearAllFlights()">清空全部</button>
      </div>
    </div>
    <div class="flight-list" id="flightListContainer"></div>
  </div>
</div>

<div id="mapContainer">
  <div id="map"></div>

  <div class="flight-info-overlay">
    <div style="font-size: 12px; color: #94a3b8;">當前狀態</div>
    <div id="overlay-status" style="font-weight: bold; color: #38bdf8; margin-top: 4px;">待命</div>
    <div id="overlay-detail" style="font-size: 12px; color: #cbd5e1; margin-top: 4px;">-</div>
  </div>
</div>

  let myFlightLogs = [];
  let mapLayers = [];
  let animTimer = null;
  let isPlaying = false;
  let flightDistances = []; // 紀錄各航段的實際距離
  let segmentDurations = []; // 紀錄各航段實際要播放的秒數（依距離長短分配後）
  let effectiveIntervalSec = 0; // 實際套用的停頓秒數（可能因航班數太多而自動收斂）
  let currentViewLng = null; // 目前鏡頭所在「世界副本」的經度基準，讓下一段接續同一份地圖播放

  // 當「航段數量多 × 停頓秒數」已經吃光甚至超過使用者選的總秒數時，
  // 自動把停頓秒數壓縮，確保停頓不會反過來把總播放時間拖到遠超過使用者的設定。
  function calcEffectiveInterval(rawIntervalSec, totalDurationSec, n) {
    if (n <= 1 || rawIntervalSec <= 0) return rawIntervalSec;
    const MAX_PAUSE_RATIO = 0.5; // 停頓總時間最多佔用整體秒數的一半，其餘留給飛行動畫本身
    const rawPauseTotal = rawIntervalSec * (n - 1);
    const maxPauseTotal = totalDurationSec * MAX_PAUSE_RATIO;
    if (rawPauseTotal <= maxPauseTotal) return rawIntervalSec;
    return maxPauseTotal / (n - 1);
  }

  // 依照「距離長短」決定每個航段的播放秒數：
  // 1) 先用 MIN_SEG_SEC ~ MAX_SEG_SEC 之間，依相對距離（本次清單中最短~最長）做線性對應，
  //    讓長程航班感覺飛比較久、短程航班飛比較快。
  // 2) 再把所有航段秒數等比例縮放，讓「所有航段秒數 + 航段間停頓秒數」的總和貼近使用者選擇的總秒數。
  function calcSegmentDurations(distances, totalDurationSec, intervalSec) {
    const MIN_SEG_SEC = 0.5;
    const MAX_SEG_SEC = 2.0;
    const n = distances.length;

    if (n === 0) return [];

    // Step 1：依相對距離算出基礎秒數
    const minD = Math.min(...distances);
    const maxD = Math.max(...distances);
    let baseDurations;
    if (n === 1 || maxD === minD) {
      const flat = (MIN_SEG_SEC + MAX_SEG_SEC) / 2;
      baseDurations = distances.map(() => flat);
    } else {
      baseDurations = distances.map(d => {
        const ratio = (d - minD) / (maxD - minD);
        return MIN_SEG_SEC + ratio * (MAX_SEG_SEC - MIN_SEG_SEC);
      });
    }

    // Step 2：扣掉航段間的停頓秒數，剩下的秒數才是用來分配給「飛行動畫」本身的時間
    const pauseTotal = intervalSec * Math.max(0, n - 1);
    let availableFlightTime = totalDurationSec - pauseTotal;

    // 保底：每段至少留一點點時間可以看到移動，但門檻要低，避免航班一多就把總秒數撐爆
    const MIN_TOTAL_FLIGHT_TIME = n * 0.05;
    if (availableFlightTime < MIN_TOTAL_FLIGHT_TIME) {
      availableFlightTime = MIN_TOTAL_FLIGHT_TIME;
    }

    const sumBase = baseDurations.reduce((a, b) => a + b, 0);
    const scale = sumBase > 0 ? (availableFlightTime / sumBase) : 1;

    // 每段最終秒數也設一個很低的下限（0.05 秒），純粹避免出現 0 秒導致除以 0
    return baseDurations.map(d => Math.max(0.05, d * scale));
  }

  const datalist = document.getElementById('airports');
  for (let key in defaultAirports) {
    let opt = document.createElement('option');
    opt.value = key;
    datalist.appendChild(opt);
  }

  const map = L.map('map', { worldCopyJump: true }).setView([20, 120], 3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    noWrap: false,
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const movingPlane = L.circleMarker([0, 0], { radius: 7, color: '#ffffff', fillColor: '#38bdf8', fillOpacity: 1 });

  function addFlight() {
    const from = document.getElementById('fromAirport').value;
    const to = document.getElementById('toAirport').value;
    const startDate = document.getElementById('startDate').value;

    if (!from || !to || !startDate) {
      alert("請至少填寫：出發地、目的地與開始日期！");
      return;
    }

    const fromCoord = defaultAirports[from] || [0, 0];
    const toCoord = defaultAirports[to] || [0, 0];

    const newLog = {
      date: startDate,
      startTime: document.getElementById('startTime').value || "",
      endDate: document.getElementById('endDate').value || "",
      endTime: document.getElementById('endTime').value || "",
      flight: document.getElementById('flightNo').value || "未定航班",
      from: from,
      to: to,
      fromCoord: fromCoord,
      toCoord: toCoord,
      airline: document.getElementById('airline').value || "未指定"
    };

    myFlightLogs.push(newLog);
    updateFlightUI();
  }

  function deleteFlight(index) {
    myFlightLogs.splice(index, 1);
    updateFlightUI();
  }

  function deleteSelectedFlights() {
    const checkboxes = document.querySelectorAll('.flight-checkbox:checked');
    if (checkboxes.length === 0) {
      alert("請先勾選要刪除的航班！");
      return;
    }
    
    if (confirm(`確定要刪除選取的 ${checkboxes.length} 筆航班紀錄嗎？`)) {
      const indicesToDelete = Array.from(checkboxes)
        .map(cb => parseInt(cb.dataset.index))
        .sort((a, b) => b - a);
      
      indicesToDelete.forEach(index => {
        myFlightLogs.splice(index, 1);
      });
      
      updateFlightUI();
    }
  }

  function clearAllFlights() {
    if (myFlightLogs.length === 0) return;
    if (confirm("確定要清空所有航班紀錄嗎？此動作無法復原！")) {
      myFlightLogs = [];
      updateFlightUI();
      clearMapLayers();
      document.getElementById('overlay-status').textContent = "待命";
      document.getElementById('overlay-detail').textContent = "-";
    }
  }

  function updateFlightUI() {
    document.getElementById('flightCount').textContent = myFlightLogs.length;
    const container = document.getElementById('flightListContainer');
    container.innerHTML = "";
    
    myFlightLogs.forEach((item, index) => {
      let div = document.createElement('div');
      div.className = "flight-item";
      div.draggable = true;
      div.dataset.index = index;

      const fromName = item.from.split(' ')[0];
      const toName = item.to.split(' ')[0];
      
      div.innerHTML = `
        <span class="drag-handle">☰</span>
        <input type="checkbox" class="flight-checkbox" data-index="${index}">
        <div class="flight-content">
          <div class="flight-main">${fromName} ✈️ ${toName} <span style="color:#f59e0b; font-size:11px;">(${item.flight})</span></div>
          <div class="flight-sub">${item.date} ${item.startTime} | ${item.airline}</div>
        </div>
        <button class="btn-delete" onclick="deleteFlight(${index})">刪除</button>
      `;

      // 拖拉事件綁定
      div.addEventListener('dragstart', handleDragStart);
      div.addEventListener('dragover', handleDragOver);
      div.addEventListener('drop', handleDrop);
      div.addEventListener('dragend', handleDragEnd);

      container.appendChild(div);
    });
  }

  // --- 拖動排序邏輯 ---
  let draggedIndex = null;

  function handleDragStart(e) {
    draggedIndex = parseInt(this.dataset.index);
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragOver(e) {
    if (e.preventDefault) e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    return false;
  }

  function handleDrop(e) {
    if (e.stopPropagation) e.stopPropagation();
    const targetIndex = parseInt(this.dataset.index);
    if (draggedIndex !== null && draggedIndex !== targetIndex) {
      const movedItem = myFlightLogs.splice(draggedIndex, 1)[0];
      myFlightLogs.splice(targetIndex, 0, movedItem);
      updateFlightUI();
    }
    return false;
  }

  function handleDragEnd() {
    this.classList.remove('dragging');
    draggedIndex = null;
  }

  function exportJSON() {
    if (myFlightLogs.length === 0) {
      alert("沒有任何飛行紀錄可匯出！");
      return;
    }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myFlightLogs, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "myFlightLogs.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (Array.isArray(data)) {
          myFlightLogs = data;
          updateFlightUI();
          alert(`成功載入 ${myFlightLogs.length} 筆飛行資料！`);
        } else {
          alert("檔案格式不正確，應為陣列 JSON");
        }
      } catch (err) {
        alert("讀取檔案失敗，請確認是否為標準 JSON 格式");
      }
    };
    reader.readAsText(file);
  }

  function clearMapLayers() {
    if (animTimer) clearTimeout(animTimer);
    if (map.hasLayer(movingPlane)) map.removeLayer(movingPlane);
    mapLayers.forEach(layer => map.removeLayer(layer));
    mapLayers = [];
  }

  function startAnimation() {
    if (myFlightLogs.length === 0) {
      alert("目前沒有航班可播放！");
      return;
    }
    if (isPlaying) return;
    clearMapLayers();

    // 預先計算所有航段的距離，再依距離長短分配每段實際要播放的秒數
    flightDistances = myFlightLogs.map(log => {
      const p1 = turf.point(log.fromCoord);
      const p2 = turf.point(log.toCoord);
      return turf.distance(p1, p2, { units: 'kilometers' });
    });

    const totalDurationSec = parseFloat(document.getElementById('totalDurationSec').value) || 10;
    const rawIntervalSec = parseFloat(document.getElementById('intervalSec').value) || 0;
    effectiveIntervalSec = calcEffectiveInterval(rawIntervalSec, totalDurationSec, flightDistances.length);
    segmentDurations = calcSegmentDurations(flightDistances, totalDurationSec, effectiveIntervalSec);

    // 每次重新播放都重置「目前鏡頭所在世界副本」的基準，讓第一段從原始座標開始，
    // 之後每一段會依上一段結束時的位置接續，不會突然跳回另一份重複地圖。
    currentViewLng = null;
    const firstFlight = myFlightLogs[0];
    map.setView([firstFlight.fromCoord[1], firstFlight.fromCoord[0]], 3, { animate: false });

    isPlaying = true;
    document.getElementById('playBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    playFlightSequence(0);
  }

  function stopAnimation() {
    if (animTimer) clearTimeout(animTimer);
    isPlaying = false;
    document.getElementById('playBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('overlay-status').textContent = "已停止";
    document.getElementById('overlay-detail').textContent = "使用者手動取消播放";
    if (map.hasLayer(movingPlane)) map.removeLayer(movingPlane);
  }

  function flattenGreatCircleCoords(geometry) {
    if (geometry.type === 'MultiLineString') {
      return geometry.coordinates.flat();
    }
    return geometry.coordinates;
  }

  function playFlightSequence(index) {
    if (!isPlaying) return;

    if (index >= myFlightLogs.length) {
      document.getElementById('overlay-status').textContent = "播放完成";
      document.getElementById('overlay-detail').textContent = "全數航線已繪製完畢";
      isPlaying = false;
      document.getElementById('playBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      if (map.hasLayer(movingPlane)) map.removeLayer(movingPlane);
      return;
    }

    const flight = myFlightLogs[index];
    const intervalSec = effectiveIntervalSec;

    // 使用 startAnimation 時預先算好的秒數（依距離長短分配，且總和已貼近使用者選擇的總秒數）
    const thisFlightDurationSec = segmentDurations[index] || 0.05;

    document.getElementById('overlay-status').textContent = `${flight.flight} (${flight.from.split(' ')[0]} ➔ ${flight.to.split(' ')[0]})`;
    document.getElementById('overlay-detail').textContent = `日期：${flight.date} ${flight.startTime} | 預計耗時：${thisFlightDurationSec.toFixed(1)}s`;

    // 描點數量依「這段要播放幾秒」動態決定（約 50fps），
    // 避免固定用 300 個點時，短秒數的航段被 10ms 的 step 下限強迫拉長播放時間。
    const FRAME_MS = 20;
    const npoints = Math.min(300, Math.max(8, Math.round((thisFlightDurationSec * 1000) / FRAME_MS)));
    const gc = turf.greatCircle(flight.fromCoord, flight.toCoord, { npoints });
    const rawCoords = flattenGreatCircleCoords(gc.geometry);

    const unwrappedCoords = [];
    let prevLng = null;

    // 讓這段的起點盡量接續「目前鏡頭所在的世界副本」：
    // 如果上一段已經往右飛到美國（等於繞去了右邊那份重複地圖），
    // 這裡就會算出對應的 offset，讓這段接著在同一份地圖上繼續飛，
    // 而不是每段都從原始座標（左邊的主要世界）重新開始。
    let offset = 0;
    if (currentViewLng !== null) {
      const rawStartLng = rawCoords[0][0];
      offset = Math.round((currentViewLng - rawStartLng) / 360) * 360;
    }

    for (let i = 0; i < rawCoords.length; i++) {
      let lng = rawCoords[i][0];
      let lat = rawCoords[i][1];

      if (!Number.isFinite(lng) || !Number.isFinite(lat)) continue;

      if (prevLng !== null) {
        let diff = lng - prevLng;
        if (diff > 180) offset -= 360;
        else if (diff < -180) offset += 360;
      }
      
      unwrappedCoords.push([lat, lng + offset]);
      prevLng = lng;
    }

    if (unwrappedCoords.length < 2) {
      console.warn('航段座標異常，已跳過：', flight);
      animTimer = setTimeout(() => playFlightSequence(index + 1), 300);
      return;
    }

    const startPt = unwrappedCoords[0];
    const endPt = unwrappedCoords[unwrappedCoords.length - 1];
    currentViewLng = endPt[1]; // 記住這段結束的位置，下一段接續同一份世界副本

    const startMarker = L.circleMarker(startPt, { radius: 5, color: '#38bdf8', fillColor: '#fff', fillOpacity: 1 }).addTo(map);
    const endMarker = L.circleMarker(endPt, { radius: 6, color: '#f43f5e', fillColor: '#f43f5e', fillOpacity: 0.8 }).addTo(map);
    const historyLine = L.polyline([], { color: '#00f2fe', weight: 3, opacity: 0.8 }).addTo(map);

    mapLayers.push(startMarker, endMarker, historyLine);

    if (!map.hasLayer(movingPlane)) movingPlane.addTo(map);

    // 計算當前航段每一 Step 的時間毫秒數
    const stepIntervalMs = Math.max(4, (thisFlightDurationSec * 1000) / unwrappedCoords.length);
    let step = 0;

    function animateStep() {
      if (!isPlaying) return;

      if (step < unwrappedCoords.length) {
        const currentCoord = unwrappedCoords[step];
        
        movingPlane.setLatLng(currentCoord);
        historyLine.addLatLng(currentCoord);
        map.setView(currentCoord, 3, { animate: false }); // 動態追蹤：鏡頭跟著飛機走

        step++;
        animTimer = setTimeout(animateStep, stepIntervalMs);
      } else {
        animTimer = setTimeout(() => {
          playFlightSequence(index + 1);
        }, intervalSec * 1000);
      }
    }

    animateStep();
  }
</script>
